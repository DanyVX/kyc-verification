[project]
name = "kyc-verification-demo"
version = "0.1.0"
description = "Synthetic, privacy-conscious KYC verification demonstration"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2", "cryptography>=43,<46", "Faker>=30,<40", "fastapi>=0.115,<1", "pillow>=10,<12",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
ocr-tesseract = ["pytesseract>=0.3.13"]
ocr-paddle = ["paddleocr>=3.0"]
vision = ["opencv-python-headless>=4.10"]

[dependency-groups]
dev = ["httpx>=0.27", "hypothesis>=6.112", "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML>=6.0"]

[project.scripts]
kyc = "kyc.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=kyc --cov-report=term-missing --cov-fail-under=70"
markers = ["slow: generated-data or external-engine test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kyc"]
